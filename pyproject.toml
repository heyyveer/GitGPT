version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Veer Tiwari", email = "virtiw1303@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "faiss-cpu>=1.15.1",
    "fastapi>=0.142.2",
    "gitpython>=3.1.62",
    "google-generativeai>=0.8.6",
    "langchain-community>=0.4.2",
    "langchain-google-genai>=4.4.0",
